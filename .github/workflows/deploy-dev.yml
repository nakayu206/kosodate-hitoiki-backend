name: Deploy (dev)

# develop へのマージで、開発用Supabaseプロジェクトへマイグレーションを反映する。
# 接続情報は GitHub Environment「development」の Secrets / Variables でのみ管理する。

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate dev project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Link dev project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        run: npx supabase db push
